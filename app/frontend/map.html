<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта завода</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-size: 32px;
        }

        .map-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 20px;
            overflow: auto;
        }

        .map-svg {
            width: 100%;
            height: auto;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
        }

        .workshop-polygon {
            stroke: #333;
            stroke-width: 3;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .workshop-polygon:hover {
            opacity: 0.85;
            stroke-width: 4;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .workshop-text {
            font-family: Arial, sans-serif;
            font-weight: bold;
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .workshop-name {
            font-size: 24px;
        }

        .workshop-code {
            font-size: 16px;
        }

        .legend {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .legend h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 20px;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .legend-color {
            display: inline-block;
            width: 24px;
            height: 24px;
            margin-right: 12px;
            border: 2px solid #333;
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 60px 40px;
            font-size: 20px;
            color: #fff;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .debug-info {
            background: #e3f2fd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1> Карта производственных цехов</h1>

    <div id="loading" class="loading">Загрузка данных...</div>
    <div id="error" class="error" style="display: none;"></div>
    <div id="debug" class="debug-info" style="display: none;"></div>

    <div class="map-wrapper" id="mapWrapper" style="display: none;">
        <svg id="mapSvg" class="map-svg" viewBox="0 0 2400 1400" preserveAspectRatio="xMidYMid meet">
            <defs>
                <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
                </pattern>
            </defs>

            <rect width="2400" height="1400" fill="url(#grid)" />
            <g id="workshopsLayer"></g>
        </svg>
    </div>

    <div class="legend" id="legend" style="display: none;">
        <h3>📋 Легенда</h3>
        <div class="legend-grid" id="legendContent"></div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8800/api';

    const WORKSHOP_COLORS = {
        '1-01': '#1565C0',  // Цех штамповки - синий
        '1-02': '#C62828',  // Цех сварки - красный
        '1-03': '#00897B',  // Цех окраски - бирюзовый
        '1-04': '#546E7A',  // Цех сборки - серо-зеленый
        '1-05': '#F9A825',  // Цех двигателей - желтый
        '1-06': '#F57C00',  // Логистика - оранжевый
        '1-07': '#2E7D32',  // Главный офис - зеленый
        'КПП': '#9C27B0',   // КПП - фиолетовый
        'default': '#757575'
    };

    // Fallback координаты (используются ТОЛЬКО если в API нет geometry)
    const WORKSHOP_POSITIONS = {
        '1-05': { geometry: { type: 'polygon', coordinates: [[800, 0], [1200, 0], [1200, 200], [800, 200]] } },
        '1-04': { geometry: { type: 'polygon', coordinates: [[400, 200], [800, 200], [800, 0], [1200, 0], [1200, 200], [2400, 200], [2400, 600], [1600, 600], [1600, 1000], [400, 1000], [400, 400]] } },
        '1-06': { geometry: { type: 'polygon', coordinates: [[0, 200], [400, 200], [400, 600], [0, 600]] } },
        '1-02': { geometry: { type: 'polygon', coordinates: [[400, 600], [1000, 600], [1000, 1000], [400, 1000]] } },
        '1-03': { geometry: { type: 'polygon', coordinates: [[1600, 600], [2400, 600], [2400, 1200], [1600, 1200]] } },
        '1-01': { geometry: { type: 'polygon', coordinates: [[200, 1000], [1000, 1000], [1000, 1200], [200, 1200]] } },
        '1-07': { geometry: { type: 'polygon', coordinates: [[1600, 1200], [2400, 1200], [2400, 1400], [1600, 1400]] } },
        'КПП': { geometry: { type: 'polygon', coordinates: [[1000, 1300], [1200, 1300], [1200, 1400], [1000, 1400]] } }
    };

    let workshops = [];

    async function init() {
        try {
            await loadWorkshops();
            renderMap();
            updateLegend();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('mapWrapper').style.display = 'block';
            document.getElementById('legend').style.display = 'block';
        } catch (error) {
            console.error('Ошибка:', error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = 'Ошибка загрузки: ' + error.message;
        }
    }

    async function loadWorkshops() {
        const response = await fetch(`${API_BASE_URL}/workshops?limit=100`);
        if (!response.ok) throw new Error('Failed to load workshops');
        workshops = await response.json();

        // Отладка: показываем какие цеха имеют geometry
        const debugInfo = workshops.map(w =>
            `${w.code} - ${w.name}: ${w.geometry ? '✅ geometry есть' : '❌ geometry нет'}`
        ).join('<br>');

        document.getElementById('debug').innerHTML = debugInfo;
        document.getElementById('debug').style.display = 'block';
    }

    function renderMap() {
        const layer = document.getElementById('workshopsLayer');
        layer.innerHTML = '';

        workshops.forEach(workshop => {
            renderWorkshop(workshop, layer);
        });
    }

    function renderWorkshop(workshop, layer) {
        const color = WORKSHOP_COLORS[workshop.code] || WORKSHOP_COLORS['default'];

        // === ПРИОРИТЕТ 1: Берем geometry из API ===
        let coordinates = null;

        if (workshop.geometry &&
            workshop.geometry.type === 'polygon' &&
            Array.isArray(workshop.geometry.coordinates) &&
            workshop.geometry.coordinates.length > 0) {
            console.log(`Цех ${workshop.code}: используем geometry из API`);
            coordinates = workshop.geometry.coordinates;
        }
        // === ПРИОРИТЕТ 2: Fallback на хардкод ===
        else if (WORKSHOP_POSITIONS[workshop.code]) {
            console.log(`Цех ${workshop.code}: geometry нет в API, используем fallback`);
            coordinates = WORKSHOP_POSITIONS[workshop.code].geometry.coordinates;
        }
        // === Нет координат — пропускаем ===
        else {
            console.warn(`Цех ${workshop.code}: нет координат ни в API, ни в fallback`);
            return;
        }

        // Создаем полигон
        const points = coordinates.map(coord => `${coord[0]},${coord[1]}`).join(' ');

        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', points);
        polygon.setAttribute('fill', color);
        polygon.setAttribute('class', 'workshop-polygon');

        layer.appendChild(polygon);

        // Добавляем текст
        const centroid = calculateCentroid(coordinates);

        const textGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

        const nameText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        nameText.setAttribute('x', centroid.x);
        nameText.setAttribute('y', centroid.y);
        nameText.setAttribute('class', 'workshop-text workshop-name');
        nameText.textContent = workshop.name;

        const codeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        codeText.setAttribute('x', centroid.x);
        codeText.setAttribute('y', centroid.y + 30);
        codeText.setAttribute('class', 'workshop-text workshop-code');
        codeText.textContent = workshop.code;

        textGroup.appendChild(nameText);
        textGroup.appendChild(codeText);
        layer.appendChild(textGroup);
    }

    function calculateCentroid(coordinates) {
        let x = 0, y = 0;
        const n = coordinates.length;

        for (let i = 0; i < n; i++) {
            x += coordinates[i][0];
            y += coordinates[i][1];
        }

        return {
            x: x / n,
            y: y / n
        };
    }

    function updateLegend() {
        const legendContent = document.getElementById('legendContent');
        legendContent.innerHTML = '';

        workshops.forEach(workshop => {
            const color = WORKSHOP_COLORS[workshop.code] || WORKSHOP_COLORS['default'];

            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
                    <span class="legend-color" style="background: ${color}"></span>
                    <strong>${workshop.code}</strong> - ${workshop.name}
                `;
            legendContent.appendChild(item);
        });
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
