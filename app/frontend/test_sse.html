        if (abortController) abortController.abort();
        abortController = new AbortController();
        document.getElementById('log').innerHTML = '<div class="msg">Подключение...</div>';

        try {
            const response = await fetch('http://127.0.0.1:8800/api/notifications/stream', {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'text/event-stream'
                },
                signal: abortController.signal
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const messages = buffer.split('\n\n');
                buffer = messages.pop(); // Оставляем неполный кусок в буфере

                for (const msg of messages) {
                    if (msg.startsWith('data: ')) {
                        const data = JSON.parse(msg.substring(6));
                        const isRealtime = data.source === 'realtime';

                        const div = document.createElement('div');
                        div.className = 'msg' + (isRealtime ? ' realtime' : '');

                        // Формируем читаемый заголовок из данных
                        const title = data.event_type_ru || data.event_type || 'Уведомление';
                        const asset = data.asset_name ? `(${data.asset_name})` : '';

                        div.innerHTML = `
                                <b>[${isRealtime ? 'REALTIME' : 'HISTORY'}]</b> ${title} ${asset}<br>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            `;
                        // Новые сообщения добавляем в начало
                        document.getElementById('log').prepend(div);
                    }
                }
            }
        } catch (e) {
            if (e.name !== 'AbortError') {
                document.getElementById('log').innerHTML += `<div class="msg" style="border-left-color: red;">Ошибка: ${e.message}</div>`;
            }
        }
    }

    function disconnect() {
        if (abortController) {
            abortController.abort();
            abortController = null;
            document.getElementById('log').innerHTML += '<div class="msg">Соединение разорвано.</div>';
        }
    }

    // закрываем соединение при закрытии вкладки
    window.addEventListener('beforeunload', disconnect);
</script>
